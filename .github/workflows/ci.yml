name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded pull request runs are cancelled. Pushes to main queue instead:
# they end in a release, and cancelling one mid-deploy is unsafe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Self-hosted runners only for a push to main, which only people with write
# access can produce. A pull request (including from a fork) is untrusted
# input and runs on a GitHub-hosted runner, so it never executes on homelab
# hardware. This repo is public: never give a pull_request-triggered job
# `runs-on: minutes-arc-runners`. See the homelab repo's
# infra/actions-runner-controller/README.md "Security note".
jobs:
  check:
    runs-on: ${{ github.event_name == 'push' && 'minutes-arc-runners' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node's cache is very slow on the ARC runner image.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - run: npm ci
      - name: TypeScript build (strict)
        run: npm run build
      - name: Shell syntax
        run: for f in entrypoint.sh deploy/k8s/*.sh scripts/*.sh; do bash -n "$f"; done
      - name: Transcriber syntax
        run: python3 -m py_compile transcriber/transcribe.py transcriber/bench.py
      - uses: azure/setup-kubectl@v5
        with:
          version: 'v1.31.0'
      - name: Render k8s manifests
        run: kubectl kustomize deploy/k8s > /dev/null

  # Unit tests, plus the recorder/stitch tests against real ffmpeg and the
  # media guard and page classifier in Playwright's Chromium. Always on a
  # GitHub-hosted runner, also for pushes to main: it installs packages,
  # which the homelab runners shouldn't need. A missing ffmpeg or Chromium
  # fails here (CI=true) instead of skipping.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests
        run: npm test

  # Builds and pushes the images while `check` runs, tagged only
  # sha-<commit>: nothing deploys a sha tag until release.yml does, after
  # every check has passed.
  #
  # Where: the persistent BuildKit daemon minutes-buildkitd (homelab
  # infra/actions-runner-controller/minutes-buildkitd.yaml), which keeps
  # every layer unpacked between runs. If it can't be reached, buildx in
  # the runner's own dind, which starts empty and pulls cached layers from
  # the registry (buildcache tags) before building on them. The registry
  # cache is exported only on that path; the daemon path reads it as a
  # fallback after a lost volume. One job, images one after another: they
  # share base layers, and the scale set has 3 runners.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: minutes-arc-runners
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      REPO: ghcr.io/langfordogsociety   # GHCR paths must be lowercase
      BUILDKITD_HOST: minutes-buildkitd.arc-runners.svc.cluster.local
    steps:
      - uses: actions/checkout@v5
      - name: is the build daemon up?
        id: daemon
        run: |
          if timeout 5 bash -c "exec 3<>/dev/tcp/$BUILDKITD_HOST/1234" 2>/dev/null; then
            echo "up=true" >> "$GITHUB_OUTPUT"; echo "building on $BUILDKITD_HOST"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"; echo "::warning::$BUILDKITD_HOST unreachable; building in dind from the registry cache"
          fi
      - if: steps.daemon.outputs.up == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://${{ env.BUILDKITD_HOST }}:1234
      - if: steps.daemon.outputs.up != 'true'
        uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: capture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REPO }}/minutes:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPO }}/minutes:buildcache
          cache-to: ${{ steps.daemon.outputs.up != 'true' && format('type=registry,ref={0}/minutes:buildcache,mode=max', env.REPO) || '' }}
      - name: transcriber image
        uses: docker/build-push-action@v7
        with:
          context: transcriber
          platforms: linux/amd64
          push: true
          tags: ${{ env.REPO }}/minutes-transcriber:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPO }}/minutes-transcriber:buildcache
          cache-to: ${{ steps.daemon.outputs.up != 'true' && format('type=registry,ref={0}/minutes-transcriber:buildcache,mode=max', env.REPO) || '' }}
      # The one the homelab runs: ROCm for k3s-07's Radeon 8060S (gfx1151).
      # The CPU image above stays for compose and other machines.
      - name: transcriber image (ROCm, gfx1151)
        uses: docker/build-push-action@v7
        with:
          context: transcriber
          file: transcriber/Dockerfile.rocm
          platforms: linux/amd64
          push: true
          tags: ${{ env.REPO }}/minutes-transcriber-rocm:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPO }}/minutes-transcriber-rocm:buildcache
          cache-to: ${{ steps.daemon.outputs.up != 'true' && format('type=registry,ref={0}/minutes-transcriber-rocm:buildcache,mode=max', env.REPO) || '' }}

  release:
    needs: [check, test, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
