# minutes on the homelab k3s cluster. See deploy/k8s/README.md.
#
#   minutes              web site + scheduler + captures (prefers k3s-04);
#                        serves the video. Zoom login on `data` (RBD).
#   minutes-transcriber  WhisperX on k3s-07's Radeon 8060S through ROCm
#                        (the -rocm image), sharing the GPU with ollama.
#
# Both mount `recordings` (CephFS, ReadWriteMany): captures write parts and
# the stitched video, the transcriber reads them (live, too) and writes the
# transcripts next to them.
apiVersion: v1
kind: Namespace
metadata:
  name: minutes
---
# Bound to the volume that zoom-capture used (moved, not copied; see
# MIGRATION.md). The PV's reclaim policy is Retain: deleting this PVC or the
# namespace keeps the data. Since the transcriber moved to k3s-07 it holds
# only the saved Zoom login (auth/); recordings/ and models/ on it are the
# pre-move copies, kept until the move is known good.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: minutes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: csi-rbd-sc
  volumeName: pvc-42360e95-88b8-445c-a3ff-a6988f5ff9cf
  resources:
    requests:
      storage: 200Gi
---
# Recordings, transcripts, minutes.db: shared by the web pod and the
# transcriber on another node, so CephFS (RWX). Set its PV to Retain after
# the first apply (README).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recordings
  namespace: minutes
spec:
  accessModes: [ReadWriteMany]
  storageClassName: csi-cephfs-sc
  resources:
    requests:
      storage: 200Gi   # ~0.6 GB per meeting hour
---
# The transcriber's model cache (~2 GB, re-downloadable).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transcriber-models
  namespace: minutes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: csi-rbd-sc
  resources:
    requests:
      storage: 20Gi
---
# Nightly backups of minutes.db and the saved Zoom login (#31), 14 days.
# CephFS, not another RBD image: a different Ceph pool and filesystem from
# `data`, and ReadWriteMany, so the restore pod (restore.sh) can read it
# while the server pod still exists. Holds live session tokens: mounted
# only into the capture container, never served. After the first apply,
# set its PV to Retain like `data` (README).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  namespace: minutes
spec:
  accessModes: [ReadWriteMany]
  storageClassName: csi-cephfs-sc
  resources:
    requests:
      storage: 1Gi   # a backup is the database (KBs to MBs) + a ~10 KB login
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minutes
  namespace: minutes
  labels: { app: minutes }
spec:
  replicas: 1   # one scheduler, one owner of minutes.db; never scale up
  strategy: { type: Recreate }   # RWO volume, and two would both join meetings
  selector:
    matchLabels: { app: minutes }
  template:
    metadata:
      labels: { app: minutes }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      # Let running captures close their part and stitch (SIGTERM path).
      terminationGracePeriodSeconds: 180
      securityContext:
        fsGroup: 1000   # pwuser and app are both uid 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100   # the 24-core worker
              preference:
                matchExpressions: [{ key: kubernetes.io/hostname, operator: In, values: [k3s-04] }]
      initContainers:
        # A new volume starts empty and root-owned; give each tree to uid 1000.
        # The saved Zoom login is seeded from the minutes-zoom-auth secret only
        # when the volume has none: the server refreshes it in place after that.
        - name: dirs
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - >-
              mkdir -p /data/auth &&
              chown 1000:1000 /backups /recordings && chmod 700 /backups &&
              { [ -s /data/auth/zoom-auth.json ] || [ ! -f /seed/zoom-auth.json ] || cp /seed/zoom-auth.json /data/auth/; } &&
              chown -R 1000:1000 /data/auth &&
              chmod 700 /data/auth && chmod -f 600 /data/auth/* || true
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: recordings, mountPath: /recordings }
            - { name: seed, mountPath: /seed, readOnly: true }
            - { name: backups, mountPath: /backups }
      containers:
        - name: capture
          image: ghcr.io/langfordogsociety/minutes:main
          args: ["serve", "--auth", "/auth/zoom-auth.json"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: CAPTURE_DEBUG, value: "1" }
            - name: CAPTURE_NOTIFY_URL
              valueFrom: { secretKeyRef: { name: minutes, key: CAPTURE_NOTIFY_URL, optional: true } }
            - name: CAPTURE_EMAIL
              valueFrom: { secretKeyRef: { name: minutes, key: CAPTURE_EMAIL, optional: true } }
            # Sign-up and password-reset mail (#32), Cloudflare Email Service.
            # Off until the secret has SMTP_URL and SMTP_PASSWORD (setup.sh).
            - name: SMTP_URL
              valueFrom: { secretKeyRef: { name: minutes, key: SMTP_URL, optional: true } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: minutes, key: SMTP_PASSWORD, optional: true } }
            - { name: MAIL_FROM, value: "minutes <minutes@emc2.build>" }
            - { name: PUBLIC_URL, value: "https://minutes.emc2.build" }
            # Also email the operator's messages (captures, transcripts, login, backups, feeds): set to your address.
            # - { name: OPERATOR_EMAIL, value: "you@example.com" }
            # Traefik runs in the pod network; only its X-Forwarded-For counts.
            - { name: TRUSTED_PROXIES, value: 10.42.0.0/16 }
            # Nightly after 03:00 local, kept 14 days (BACKUP_KEEP_DAYS).
            - { name: BACKUP_DIR, value: /backups }
          resources:
            # x264 1080p30 + Chromium per meeting; two overlapping captures fit.
            # Requests are what's free to reserve on k3s-04; limits use its idle cores.
            requests: { cpu: 1500m, memory: 3Gi }
            limits: { cpu: "8", memory: 8Gi }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: recordings, mountPath: /recordings }
            - { name: data, mountPath: /auth, subPath: auth }
            - { name: backups, mountPath: /backups }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: data }
        - name: recordings
          persistentVolumeClaim: { claimName: recordings }
        - name: backups
          persistentVolumeClaim: { claimName: backups }
        - name: seed
          secret: { secretName: minutes-zoom-auth, optional: true, defaultMode: 0400 }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
---
# WhisperX on k3s-07's Radeon 8060S (gfx1151) through ROCm: ~15x faster
# than real time vs ~0.65x on k3s-04's CPU (transcriber/bench.py). The GPU
# is shared with ollama through the generic device plugin's devic.es/amd-gpu
# (/dev/kfd + the render node; homelab infra/generic-device-plugin), so no
# privileged mode. Restarting it never touches a capture: an interrupted
# transcript is redone on start. Without a usable GPU it falls back to
# k3s-07's CPU (still ~4x k3s-04) and logs why.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minutes-transcriber
  namespace: minutes
  labels: { app: minutes-transcriber }
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO model cache
  selector:
    matchLabels: { app: minutes-transcriber }
  template:
    metadata:
      labels: { app: minutes-transcriber }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      nodeSelector: { kubernetes.io/hostname: k3s-07 }
      tolerations: [{ key: gpu, operator: Exists }]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        # 110 = render on k3s-07: owns /dev/kfd and /dev/dri/renderD128.
        supplementalGroups: [110]
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: transcriber
          image: ghcr.io/langfordogsociety/minutes-transcriber-rocm:main
          env:
            - { name: WHISPER_MODEL, value: large-v3-turbo }
            - { name: WHISPER_DEVICE, value: cuda }   # ROCm says "cuda" too
            - { name: TORCH_MIOPEN, value: "0" }      # MIOpen's batch-norm JIT fails on gfx1151
            # CPU work (decoding, VAD glue, and the fallback): k3s-07's
            # os.cpu_count() sees 28 cores, not the limit.
            - { name: WHISPER_THREADS, value: "10" }
            - { name: OMP_NUM_THREADS, value: "10" }
            - { name: MKL_NUM_THREADS, value: "10" }
            - { name: LIVE, value: "1" }
            - { name: LIVE_CHUNK_S, value: "60" }
            - { name: LIVE_CHUNK_MAX_S, value: "300" }
            # Its own node, so the final pass needn't wait for captures.
            - { name: WAIT_FOR_CAPTURES, value: "0" }
            - { name: DIARIZE_STEP, value: "0.25" }
            - { name: MALLOC_ARENA_MAX, value: "2" }
            - name: HF_TOKEN
              valueFrom: { secretKeyRef: { name: minutes, key: HF_TOKEN, optional: true } }
          resources:
            # Memory includes room for the models in GPU memory, which on
            # this APU is system RAM the cgroup may not see (like ollama's).
            requests: { cpu: "2", memory: 8Gi, devic.es/amd-gpu: "1" }
            limits: { cpu: "12", memory: 16Gi, devic.es/amd-gpu: "1" }
          volumeMounts:
            - { name: recordings, mountPath: /recordings }
            - { name: models, mountPath: /models }
      volumes:
        - name: recordings
          persistentVolumeClaim: { claimName: recordings }
        - name: models
          persistentVolumeClaim: { claimName: transcriber-models }
---
apiVersion: v1
kind: Service
metadata:
  name: minutes
  namespace: minutes
spec:
  selector: { app: minutes }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
# LAN host: the public site plus the admin (/admin, admin account needed).
# The public host, minutes.emc2.build, is public.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: minutes
spec:
  ipAllowList:
    sourceRange: ["192.168.0.0/16"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-from-zoom
  namespace: minutes
spec:
  redirectRegex:
    permanent: true
    regex: ^https?://[^/]+/?(.*)
    replacement: https://minutes.lab.emc2.build/${1}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minutes
  namespace: minutes
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: minutes-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: [minutes.lab.emc2.build], secretName: minutes-lab-tls }]
  rules:
    - host: minutes.lab.emc2.build
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: minutes, port: { name: http } } }
---
# Old bookmarks: zoom.lab.emc2.build -> minutes.lab.emc2.build (LAN only too).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redirect-zoom-lab
  namespace: minutes
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: minutes-lan-only@kubernetescrd,minutes-redirect-from-zoom@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: [zoom.lab.emc2.build], secretName: zoom-lab-redirect-tls }]
  rules:
    - host: zoom.lab.emc2.build
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: minutes, port: { name: http } } }
