# Web interface + scheduler, and the transcription service, sharing recordings/.
#
#   docker compose up -d --build
#   open http://127.0.0.1:8080/
#
# Set CAPTURE_WEB_TOKEN (e.g. in a .env file next to this one) to require a
# password. The port is published on 127.0.0.1 only.
services:
  capture:
    build: .
    image: zoom-capture
    command: ["serve", "--auth", "/auth/zoom-auth.json"]
    ports: ["127.0.0.1:8080:8080"]
    shm_size: 1g
    stop_grace_period: 120s   # let running captures stitch
    restart: unless-stopped
    # Seen 2026-11-09: the VM ran out of memory mid-meeting and the kernel
    # killed a capture's Xvfb (Chromium and the recording went with it).
    # Make this container the last choice; Chromium's renderers still set
    # their own higher score, and a dead renderer is just a rejoin.
    oom_score_adj: -500
    environment:
      CAPTURE_WEB_TOKEN: ${CAPTURE_WEB_TOKEN:-}
      # Screenshot + every frame's HTML on each state change, in <slug>/debug/.
      # On for the first real meetings; set CAPTURE_DEBUG=0 in .env to turn off.
      CAPTURE_DEBUG: ${CAPTURE_DEBUG:-1}
      # Optional: POST a text alert here when the saved Zoom login expires
      # (an ntfy.sh topic URL works). Set in .env.
      CAPTURE_NOTIFY_URL: ${CAPTURE_NOTIFY_URL:-}
    volumes:
      - ./recordings:/recordings
      - ./auth:/auth

  transcriber:
    build: ./transcriber
    image: zoom-transcriber
    restart: unless-stopped
    init: true   # reap ffmpeg children so the container can always stop
    # Models take several GB. Capped so it can only run out of its own memory,
    # never starve a live capture; first in line if the VM runs short anyway.
    mem_limit: ${TRANSCRIBER_MEM:-4500m}
    oom_score_adj: 800
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WAIT_FOR_CAPTURES: "1"   # final pass waits for captures; live chunks don't
      LIVE: ${LIVE_TRANSCRIBE:-1}
      LIVE_CHUNK_S: ${LIVE_CHUNK_S:-120}
      LIVE_CHUNK_MAX_S: ${LIVE_CHUNK_MAX_S:-300}
      IDLE_UNLOAD_S: ${IDLE_UNLOAD_S:-600}
      DIARIZE_STEP: ${DIARIZE_STEP:-0.25}
      MALLOC_ARENA_MAX: "2"   # glibc fragmentation across torch/ctranslate2 threads
      # Gated pyannote diarization models (Phase 2). Set in .env, never committed.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./recordings:/recordings
      - models:/models

volumes:
  models:
